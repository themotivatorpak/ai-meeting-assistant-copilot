appId: com.notanotherai.aimeetingassistantcopilot
productName: AI Meeting Assistant Copilot
copyright: "Packaged by Not Another AI | Upstream MIT License Copyright (c) 2026 Tanzeel Ur Rehman (@tanzeeldevAi)"

directories:
  output: dist-installer
  buildResources: build

files:
  - "src/**/*"
  - "package.json"
  - "LICENSE"
  - "THIRD_PARTY_LICENSES.md"
  - "!audio/**"
  - "!.venv/**"
  - "!dist-python/**"
  - "!dist-installer/**"
  - "!**/*.bat"
  - "!**/*.command"

extraResources:
  - from: "dist-python/audio-engine"
    to: "audio-engine"
  - from: "LICENSE"
    to: "LICENSE"
  - from: "THIRD_PARTY_LICENSES.md"
    to: "THIRD_PARTY_LICENSES.md"
  - from: "build/INSTALLER_LICENSE.txt"
    to: "INSTALLER_LICENSE.txt"

win:
  target:
    - target: nsis
      arch:
        - x64
  icon: "build/icon.ico"
  artifactName: "${productName}-Setup-${version}-${arch}.${ext}"

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  license: "build/INSTALLER_LICENSE.txt"
  installerIcon: "build/installer.ico"
  uninstallerIcon: "build/installer.ico"
  installerHeaderIcon: "build/installer.ico"
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: "AI Meeting Assistant Copilot"
  include: "build/installer.nsh"
